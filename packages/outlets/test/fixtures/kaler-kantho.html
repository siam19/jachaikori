<script type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","headline":"নতুন থানা-পৌরসভা গঠনসহ ৪ প্রস্তাবে সুপারিশের সিদ্ধান্ত","image":["https://asset.kalerkantho.com/public/news_images/2026/11/15/1794683675-572d66b092c8a2d2da222f1e07be1f84.jpg"],"datePublished":"2026-11-15T01:14:37+06:00","dateModified":"2026-11-15T01:14:37+06:00","author":[{"@type":"Person","name":"অনলাইন ডেস্ক","url":"https://www.kalerkantho.com/author/"}],"publisher":{"@type":"Organization","name":"Kaler Kantho","logo":{"@type":"ImageObject","url":"https://www.kalerkantho.com/logo.png"}},"description":"নতুন থানা, পৌরসভা গঠন, পুলিশ তদন্তকেন্দ্র স্থাপন, থানার নাম পরিবর্তন এবং দুটি সরকারি সংস্থার সাংগঠনিক কাঠামো পরিবর্তনের প্রস্তাবসহ মোট সাতটি প্রস্তাব নিয়ে অনুষ্ঠিত হয়েছে প্রাক-নিকার সচিব কমিটির বৈঠক।","articleBody":"নতুন থানা, পৌরসভা গঠন, পুলিশ তদন্তকেন্দ্র স্থাপন, থানার নাম পরিবর্তন এবং দুটি সরকারি সংস্থার সাংগঠনিক কাঠামো পরিবর্তনের প্রস্তাবসহ মোট সাতটি প্রস্তাব নিয়ে অনুষ্ঠিত হয়েছে প্রাক-নিকার সচিব কমিটির বৈঠক।\r\n\r\nগত ৯ নভেম্বর দুপুরে সচিবালয়ে অনুষ্ঠিত এ বৈঠকে সভাপতিত্ব করেন মন্ত্রিপরিষদ সচিব নাসিমুল গনি।&nbsp;\r\n\r\nবৈঠকে যাচাই-বাছাই শেষে সাতটি প্রস্তাবের বিষয়ে বিভিন্ন সিদ্ধান্ত নেওয়া হয়। এর মধ্যে চারটিতে সুপারিশ করার সিদ্ধান্ত, একটি নাকচ এবং বাকি দুটিতে পর্যবেক্ষণ দেওয়া হয়েছে।\r\n\r\nবৈঠকে জয়পুরহাটের কালাইয়ে মাত্রাই বাজার পুলিশ তদন্তকেন্দ্র স্থাপন, ময়মনসিংহের পাগলা থানার নাম পরিবর্তন করে দক্ষিণ গফরগাঁও থানা করা, সিলেটের জৈন্তাপুরে নতুন পৌরসভা গঠন এবং বগুড়ার শিবগঞ্জ থানাকে বিভক্ত করে মোকামতলা থানা স্থাপনের প্রস্তাব সুপারিশ করার সিদ্ধান্ত হয়।\r\n\r\nঅন্যদিকে, কুমিল্লার চৌদ্দগ্রামের কনকাপৈত তদন্তকেন্দ্রকে থানায় উন্নীত করার প্রস্তাব নাকচ করা হয়েছে।\r\n\r\nএ ছাড়া জাতীয় আইনগত সহায়তা প্রদান সংস্থাকে অধিদপ্তরে রূপান্তর এবং বাংলাদেশ পানি উন্নয়ন বোর্ডকে অধিদপ্তরে রূপান্তরের প্রস্তাবে পর্যবেক্ষণ দেওয়া হয়েছে।\r\n\r\nনতুন বিভাগ, জেলা, উপজেলা, সিটি করপোরেশন, পৌরসভা বা থানা গঠনের মতো প্রশাসনিক পুনর্বিন্যাসের প্রস্তাব চূড়ান্তভাবে বিবেচনার জন্য নিকার সভায় উপস্থাপনের আগে প্রাক-নিকার সচিব কমিটিতে আলোচনা করা হয়। বিভিন্ন মন্ত্রণালয় ও বিভাগ থেকে পাঠানো এসব প্রস্তাব যাচাই-বাছাই করে কমিটি নিকার সভায় সুপারিশ করবে কি না, সে বিষয়ে সিদ্ধান্ত দেয়।\r\n\r\nবৈঠকে জয়পুরহাট জেলার কালাই থানাধীন মাত্রাই ইউনিয়নের মাত্রাই বাজার এলাকায় &lsquo;মাত্রাই বাজার পুলিশ তদন্তকেন্দ্র&rsquo; স্থাপনের প্রস্তাব সুপারিশ করার সিদ্ধান্ত হয়েছে। স্বরাষ্ট্র মন্ত্রণালয় থেকে এ প্রস্তাব পাঠানো হয়। স্থানীয় পর্যায়ে পুলিশি কার্যক্রম পরিচালনা ও আইনশৃঙ্খলা রক্ষায় তদন্তকেন্দ্র স্থাপনের বিষয়টি প্রস্তাবে তুলে ধরা হয়েছে।\r\n\r\nময়মনসিংহ জেলার নবসৃষ্ট উপজেলা দক্ষিণ গফরগাঁওয়ের নামের সঙ্গে সামঞ্জস্য রেখে পাগলা থানার নাম পরিবর্তনের প্রস্তাবেও সুপারিশ করার সিদ্ধান্ত হয়েছে।&nbsp;\r\n\r\nস্বরাষ্ট্র মন্ত্রণালয়ের প্রস্তাব অনুযায়ী, পাগলা থানার নাম পরিবর্তন করে &lsquo;দক্ষিণ গফরগাঁও থানা&rsquo; করার কথা বলা হয়েছে। নতুন উপজেলার নামের সঙ্গে থানার নামের সামঞ্জস্য রাখতেই এ উদ্যোগ নেওয়া হয়েছে।\r\n\r\nসিলেট জেলার জৈন্তাপুর উপজেলায় নতুন পৌরসভা গঠনের প্রস্তাবেও সুপারিশ করার সিদ্ধান্ত হয়েছে। স্থানীয় সরকার বিভাগ থেকে এ প্রস্তাব পাঠানো হয়।\r\n\r\nজানা গেছে, জৈন্তাপুর পৌরসভা গঠনের উদ্যোগের অংশ হিসেবে সিলেট-৪ আসনের সংসদ সদস্য ও মন্ত্রী আরিফুল হক চৌধুরী গত ২৫ ফেব্রুয়ারি স্থানীয় সরকার বিভাগে একটি আধাসরকারি পত্র (ডিও লেটার) দেন। এর পরিপ্রেক্ষিতে পৌরসভা গঠনের প্রস্তাবটি প্রশাসনিক প্রক্রিয়ায় এগিয়ে নেওয়া হয়।\r\n\r\nএ ছাড়া বগুড়া জেলার শিবগঞ্জ থানাকে বিভক্ত করে নবসৃষ্ট মোকামতলা উপজেলায় &lsquo;মোকামতলা থানা&rsquo; স্থাপনের প্রস্তাবেও সুপারিশ করার সিদ্ধান্ত হয়েছে। স্বরাষ্ট্র মন্ত্রণালয় থেকে এ প্রস্তাব পাঠানো হয়। প্রস্তাবটি বাস্তবায়িত হলে মোকামতলা উপজেলার জন্য পৃথক থানা হবে।\r\n\r\nকুমিল্লা জেলার চৌদ্দগ্রাম থানাধীন কনকাপৈত তদন্তকেন্দ্রকে থানায় উন্নীত করার প্রস্তাব নাকচ করেছে প্রাক-নিকার সচিব কমিটি। স্বরাষ্ট্র মন্ত্রণালয় থেকে এ প্রস্তাব পাঠানো হয়েছিল। তবে বৈঠকে প্রস্তাবটি সুপারিশ না করার সিদ্ধান্ত নেওয়া হয়।\r\n\r\nজাতীয় আইনগত সহায়তা প্রদান সংস্থাকে &lsquo;বাংলাদেশ আইনগত সহায়তা অধিদপ্তর&rsquo; নামে রূপান্তরের প্রস্তাবে পর্যবেক্ষণ দিয়েছে কমিটি। আইন ও বিচার বিভাগ থেকে এ প্রস্তাব পাঠানো হয়। তবে বৈঠকে প্রস্তাবটির বিষয়ে চূড়ান্ত সুপারিশ করা হয়নি।\r\n\r\nএকইভাবে বাংলাদেশ পানি উন্নয়ন বোর্ডকে &lsquo;বাংলাদেশ পানি উন্নয়ন অধিদপ্তর&rsquo; হিসেবে রূপান্তরের প্রস্তাবেও পর্যবেক্ষণ দেওয়া হয়েছে। পানি সম্পদ মন্ত্রণালয় থেকে এ প্রস্তাব পাঠানো হয়।\r\n\r\nপ্রাক-নিকার সচিব কমিটির বৈঠকে কোনো প্রস্তাবে পর্যবেক্ষণ দেওয়ার অর্থ হলো, প্রস্তাবটির বিষয়ে আরও তথ্য, ব্যাখ্যা বা প্রয়োজনীয় সংশোধনের প্রয়োজন রয়েছে বলে মনে করা হয়েছে। এজন্য সংশ্লিষ্ট মন্ত্রণালয়কে কমিটির পর্যবেক্ষণ অনুযায়ী প্রয়োজনীয় তথ্য ও ব্যাখ্যা সংযোজন করে আবার উপস্থাপনের জন্য নির্দেশনা দেওয়া হয়। পরবর্তী সময়ে এসব বিষয় পর্যালোচনা করে কমিটি সুপারিশের বিষয়ে সিদ্ধান্ত নেবে।\r\n\r\nমন্ত্রিপরিষদ বিভাগের একজন যুগ্মসচিব বলেন, সাতটি প্রস্তাবের মধ্যে চারটি সুপারিশ করার সিদ্ধান্ত হয়েছে। একটি প্রস্তাব নাকচ করা হয়েছে এবং বাকি দুটি প্রস্তাবে পর্যবেক্ষণ দেওয়া হয়েছে। পর্যবেক্ষণ পাওয়া প্রস্তাবগুলোতে কমিটির নির্দেশনা পূরণ করে পুনরায় উপস্থাপন করতে হবে। এরপর সেগুলো নিয়ে আবার আলোচনা হবে।&nbsp;\r\n\r\nতিনি আরো বলেন, সুপারিশ করার সিদ্ধান্ত নেওয়া ৪ প্রস্তাবের বিষয়ে নিকার সভায় মূল সিদ্ধান্ত হবে। প্রধানমন্ত্রীর সভাপতিত্বে অনুষ্ঠিত সভায় অনুমোদন পেলেই এগুলো বাস্তবায়ন করা হবে। তবে নিকার সভা কবে হবে সে বিষয়ে এখনো সিদ্ধান্ত হয়নি।"}</script>
